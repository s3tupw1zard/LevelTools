name: "LevelTools"
version: "${version}"
main: "me.byteful.plugin.leveltools.LevelToolsPlugin"
authors:
  - byteful
  - s3tupw1zard
description: "LevelTools, originally created by byteful and extended by s3tupw1zard."
website: "https://github.com/s3tupw1zard/LevelTools"
api-version: "26.2"
folia-supported: true
softdepend:
  - PlaceholderAPI
permissions:
  leveltools.admin:
    description: "Permission to use admin commands."
    default: op
  leveltools.enabled:
    description: "Permission to let a player level up a tool."
    default: true
  leveltools.formula.*:
    description: "Wildcard permission for configured XP formulas."
    default: false
