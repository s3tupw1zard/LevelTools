#
# Trigger Profiles - define WHEN and WHERE XP can be gained.
# XP amounts live in xp_sources.yml.
#
# Trigger Types:
# BLOCK_BREAK, ENTITY_KILL, FISHING, RIGHT_CLICK, LEFT_CLICK,
# CONSUME, FARMING, ARMOR_DURABILITY
#
profiles:
  block_mining:
    type: BLOCK_BREAK
    filter:
      type: BLACKLIST
      list:
        - "FIRE"
        - "SOUL_FIRE"
        - "CRIMSON_FUNGUS"
        - "BROWN_MUSHROOM"
        - "RED_MUSHROOM"
        - "CRIMSON_ROOTS"
        - "GRASS"
        - "TALL_GRASS"
        - "SEAGRASS"
        - "TORCH"
        - "FERN"
        - "LARGE_FERN"
        - "SUNFLOWER"
        - "CORNFLOWER"

  # Combat XP is handled by the damage-contribution engine in xp_sources.yml.
  combat:
    type: ENTITY_KILL
    filter:
      type: BLACKLIST
      list:
        - "PLAYER"

  fishing:
    type: FISHING
    filter:
      type: BLACKLIST
      list: []

  armor_durability:
    type: ARMOR_DURABILITY
    slots:
      - HELMET
      - CHESTPLATE
      - LEGGINGS
      - BOOTS
    filter:
      type: BLACKLIST
      list: []

  farming:
    type: FARMING
    filter:
      type: WHITELIST
      list:
        - "TILL"
        - "WHEAT"
        - "CARROTS"
        - "POTATOES"
        - "BEETROOTS"
        - "NETHER_WART"
        - "COCOA"
        - "SWEET_BERRY_BUSH"
        - "MELON"
        - "PUMPKIN"
        - "SUGAR_CANE"
        - "BAMBOO"
        - "CACTUS"
        - "KELP"
        - "KELP_PLANT"
        - "BROWN_MUSHROOM"
        - "RED_MUSHROOM"

  # Custom profiles remain possible. If no matching source entry exists in
  # xp_sources.yml, legacy xp_modifier values in a custom trigger profile still work.
