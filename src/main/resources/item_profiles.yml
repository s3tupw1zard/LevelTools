#
# Item Profiles - Define which items can level up.
# Strength and XP curves are referenced from dedicated profile files.
#
profiles:
  pickaxes:
    materials:
      - WOODEN_PICKAXE
      - STONE_PICKAXE
      - IRON_PICKAXE
      - GOLDEN_PICKAXE
      - COPPER_PICKAXE
      - DIAMOND_PICKAXE
      - NETHERITE_PICKAXE
    trigger_profiles: [block_mining]
    reward_profile: none
    display_profile: tool
    progression_profile: default
    stat_profile: tool

  axes:
    materials:
      - WOODEN_AXE
      - STONE_AXE
