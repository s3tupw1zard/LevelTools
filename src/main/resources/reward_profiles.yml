#
# Reward Profiles
#
# Formula-based stats are NOT rewards and do not belong here.
# Default item profiles use "none", so leveling never adds enchantments automatically.
#
# Reward profiles remain available for optional milestone actions such as commands,
# cosmetic effects or server-specific events.
#
profiles:
  none:
    levels: {}

  # Example:
  # prestige_message:
  #   levels:
  #     100:
  #       - "command tellraw {player} {\"text\":\"Your item reached max level!\"}"
